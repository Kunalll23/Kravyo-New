<!DOCTYPE html>

    <circle cx="460" cy="35" r="11" fill="#000000" stroke="#000000" stroke-width="1.3" />

    <line x1="460" y1="1170" x2="460" y2="1215" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
