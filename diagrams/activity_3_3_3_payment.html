<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 10px;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  svg {
    background: #ffffff;
  }
</style>
</head>
<body>
<svg width="960" height="1140" viewBox="0 0 960 1140" xmlns="http://www.w3.org/2000/svg">
    
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
  </marker>
</defs>


    <circle cx="480" cy="40" r="11" fill="#000000" stroke="#000000" stroke-width="1.3" />
    <line x1="480" y1="51" x2="480" y2="80" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="375.0" y="80.0" width="210" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Review Cart Items</text>
        
    
    <line x1="480" y1="124" x2="480" y2="155" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="375.0" y="156.0" width="210" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Select Delivery Address</text>
        
    
    <line x1="480" y1="200" x2="480" y2="235" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="375.0" y="236.0" width="210" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Calculate Bill Total</text>
        
    
    <line x1="480" y1="280" x2="480" y2="321" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <polygon points="480,321.0 494.0,335 480,349.0 466.0,335" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
    <!-- Path 1: UPI -->
    <path d="M 466 335 L 220 335 L 220 385" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="240" y="325" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[UPI QR]</text>
    
    <rect x="130.0" y="386.0" width="180" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="220" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Generate UPI QR Code</text>
        
    
    <line x1="220" y1="430" x2="220" y2="480" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- Path 2: Card / Netbanking -->
    <line x1="480" y1="349" x2="480" y2="385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="470.0" y="367.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Card / Netbanking]</text>
    
    <rect x="390.0" y="386.0" width="180" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Authorize Online Payment</text>
        
    
    <line x1="480" y1="430" x2="480" y2="480" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- Path 3: COD -->
    <path d="M 494 335 L 740 335 L 740 385" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="630" y="325" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Cash on Delivery]</text>
    
    <rect x="650.0" y="386.0" width="180" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="740" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Select Cash on Delivery</text>
        
    
    <line x1="740" y1="430" x2="740" y2="480" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- JOIN BAR for Payment Methods -->
    <line x1="80" y1="480" x2="780" y2="480" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="88" y="496" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[Payment Synchronized]</text>
    <line x1="480" y1="480" x2="480" y2="526" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <polygon points="480,526.0 494.0,540 480,554.0 466.0,540" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
    <!-- Payment Failure Retry Loop -->
    <path d="M 494 540 L 870 540 L 870 258 L 585 258" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="508" y="530" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Payment Failed]</text>
    
    <!-- Order Verified -->
    <line x1="480" y1="554" x2="480" y2="600" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="470.0" y="577.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Payment Confirmed]</text>
    
    <rect x="375.0" y="600.0" width="210" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Confirm Order & Receipt</text>
        
    
    <line x1="480" y1="644" x2="480" y2="680" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- FORK BAR -->
    <line x1="100" y1="680" x2="700" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="108" y="672" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[Notify Customer & Kitchen]</text>
    
    <!-- Thread 1: Customer Lane -->
    <line x1="310" y1="680" x2="310" y2="720" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="220.0" y="720.0" width="180" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="310" y="746" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Send Confirmation SMS/Email</text>
        
    
    <line x1="310" y1="764" x2="310" y2="805" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- Thread 2: Kitchen Lane -->
    <line x1="650" y1="680" x2="650" y2="720" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="560.0" y="720.0" width="180" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="650" y="746" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Notify Kitchen of Order</text>
        
    
    <line x1="650" y1="764" x2="650" y2="805" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- JOIN BAR -->
    <line x1="100" y1="805" x2="700" y2="805" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="108" y="821" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[Notifications Sent]</text>
    
    <line x1="480" y1="805" x2="480" y2="846" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="375.0" y="846.0" width="210" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="872" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Open Live Order Tracking</text>
        
    
    <line x1="480" y1="890" x2="480" y2="925" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <circle cx="480" cy="940" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <circle cx="480" cy="940" r="8" fill="#000000" stroke="#000000" stroke-width="1" />
    
    
    </svg>
</body>
</html>
