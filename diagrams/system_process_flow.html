<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 15px;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  svg {
    background: #ffffff;
  }
</style>
</head>
<body>
<svg width="1200" height="1380" viewBox="0 0 1200 1380" xmlns="http://www.w3.org/2000/svg">
    
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
  </marker>
</defs>

    
    <!-- Title -->
    <text x="600" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#000000">Kravyo Platform: End-to-End System Process Flow</text>
    <text x="600" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">(Cross-Actor Operational Flow: Customer, Home Chef, Smart Dispatch Engine, Courier & Admin Settlement)</text>
    
    <!-- Swimlane Headers -->
    <!-- Lane 1: Customer -->
    <rect x="40" y="70" width="270" height="38" rx="6" fill="#f1f3f5" stroke="#000000" stroke-width="1.3"/>
    <text x="175" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">1. CUSTOMER</text>
    
    <!-- Lane 2: Home Chef -->
    <rect x="320" y="70" width="270" height="38" rx="6" fill="#f1f3f5" stroke="#000000" stroke-width="1.3"/>
    <text x="455" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">2. HOME CHEF (KITCHEN)</text>
    
    <!-- Lane 3: System / Dispatch Engine -->
    <rect x="600" y="70" width="270" height="38" rx="6" fill="#f1f3f5" stroke="#000000" stroke-width="1.3"/>
    <text x="735" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">3. BACKEND & DISPATCH</text>
    
    <!-- Lane 4: Delivery Partner & Admin -->
    <rect x="880" y="70" width="280" height="38" rx="6" fill="#f1f3f5" stroke="#000000" stroke-width="1.3"/>
    <text x="1020" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">4. COURIER & SETTLEMENT</text>
    
    <!-- Swimlane vertical divider lines (dashed) -->
    <line x1="315" y1="110" x2="315" y2="1320" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="595" y1="110" x2="595" y2="1320" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="875" y1="110" x2="875" y2="1320" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" />
    
    <!-- ========================================== -->
    <!-- STAGE 1: ORDER CREATION (CUSTOMER) -->
    <!-- ========================================== -->
    <circle cx="175" cy="135" r="12" fill="#000000" stroke="#000000" stroke-width="1.2" />
    <line x1="175" y1="147" x2="175" y2="175" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="65.0" y="176.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="175" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Browse Nearby Verified Kitchens</text>
        <text x="175" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">(Diet Filter: Veg/Jain/Diabetic)</text>
        
    
    <line x1="175" y1="220" x2="175" y2="245" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="65.0" y="246.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="175" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Customize Cooking Preferences</text>
        <text x="175" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">(Spice, Oil Level, Jain, Custom Notes)</text>
        
    
    <line x1="175" y1="290" x2="175" y2="315" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="65.0" y="316.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="175" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Select Delivery Address &</text>
        <text x="175" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Validate 15 km Radius (Haversine)</text>
        
    
    <line x1="175" y1="360" x2="175" y2="385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="65.0" y="386.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="175" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Multi-Channel Checkout</text>
        <text x="175" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">(COD / Dynamic UPI QR / Razorpay)</text>
        
    
    <line x1="175" y1="430" x2="175" y2="455" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="65.0" y="456.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="175" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Order Placed & Secret</text>
        <text x="175" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">4-Digit Handover OTP Generated</text>
        
    
    
    <!-- Line from Customer to Chef: Order Dispatched -->
    <line x1="175" y1="500" x2="175" y2="520" stroke="#000000" stroke-width="1.2" />
    <line x1="175" y1="520" x2="455" y2="520" stroke="#000000" stroke-width="1.2" />
    <line x1="455" y1="520" x2="455" y2="545" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="463.0" y="532.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="start">Order Notify (WebSocket)</text>
    
    <!-- ========================================== -->
    <!-- STAGE 2: KITCHEN OPERATIONS (HOME CHEF) -->
    <!-- ========================================== -->
    
    <rect x="345.0" y="546.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="455" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Incoming Order Chime Alert</text>
        <text x="455" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">(Continuous beep.wav via Web Audio)</text>
        
    
    <line x1="455" y1="590" x2="455" y2="615" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <polygon points="455,616.0 535.0,642 455,668.0 375.0,642" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="455" y="639" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">Chef Accepts</text>
        <text x="455" y="653" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">Order?</text>
        
    
    
    <!-- Chef Rejects -> Instant Refund -->
    <line x1="375" y1="642" x2="175" y2="642" stroke="#000000" stroke-width="1.2" />
    <text x="275.0" y="632" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">No: Reject Order</text>
    <line x1="175" y1="642" x2="175" y2="691" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="65.0" y="693.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="175" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Automated Instant Refund</text>
        <text x="175" y="727" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">via Razorpay REST API to Source</text>
        
    
    <line x1="175" y1="737" x2="175" y2="765" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <circle cx="175" cy="777" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <circle cx="175" cy="777" r="8" fill="#000000" />
    
    
    <!-- Chef Accepts -> Cook -->
    <line x1="455" y1="668" x2="455" y2="715" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="463.0" y="691.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="start">Yes: Accept</text>
    
    <rect x="345.0" y="716.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="455" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Kitchen Preparation &</text>
        <text x="455" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Portion Packaging with Dietary Tags</text>
        
    
    <line x1="455" y1="760" x2="455" y2="790" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="345.0" y="790.0" width="220" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="455" y="809" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Mark Order 'Ready for Pickup'</text>
        <text x="455" y="824" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">in Chef Order Management Console</text>
        
    
    
    <!-- Line from Chef to Backend Dispatch Engine -->
    <line x1="455" y1="834" x2="455" y2="855" stroke="#000000" stroke-width="1.2" />
    <line x1="455" y1="855" x2="735" y2="855" stroke="#000000" stroke-width="1.2" />
    <line x1="735" y1="855" x2="735" y2="880" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="743.0" y="867.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="start">Trigger DispatchService</text>
    
    <!-- ========================================== -->
    <!-- STAGE 3: SMART CASCADE DISPATCH (BACKEND) -->
    <!-- ========================================== -->
    
    <rect x="620.0" y="880.0" width="230" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="735" y="899" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">4-Stage Smart Cascade Dispatch</text>
        <text x="735" y="914" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Stage 1: Active Corridor Batching</text>
        
    
    <line x1="735" y1="924" x2="735" y2="948" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="620.0" y="948.0" width="230" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="735" y="967" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Stage 2: 25-Second Targeted Ping</text>
        <text x="735" y="982" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">to Nearest Idle Online Courier</text>
        
    
    <line x1="735" y1="992" x2="735" y2="1016" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <polygon points="735,1017.0 815.0,1042 735,1067.0 655.0,1042" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="735" y="1039" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">Courier Accepts</text>
        <text x="735" y="1053" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">in 25s?</text>
        
    
    
    <!-- Courier Timeout / Reject -> Cascade to 2nd nearest -->
    <line x1="655" y1="1042" x2="608" y2="1042" stroke="#000000" stroke-width="1.2" />
    <line x1="608" y1="1042" x2="608" y2="970" stroke="#000000" stroke-width="1.2" />
    <text x="604" y="1010" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#000000">No: Cascade / Timeout</text>
    <line x1="608" y1="970" x2="620" y2="970" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- Courier Accepts -> Handoff to Courier Lane -->
    <line x1="815" y1="1042" x2="1020" y2="1042" stroke="#000000" stroke-width="1.2" />
    <line x1="1020" y1="1042" x2="1020" y2="1070" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="1028.0" y="1056.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="start">Yes: Lock Rider</text>
    
    <!-- =================================================== -->
    <!-- STAGE 4: COURIER TRANSIT & VERIFIED OTP HANDOVER -->
    <!-- =================================================== -->
    
    <rect x="905.0" y="1070.0" width="230" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="1020" y="1089" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Turn-by-Turn Navigation to Kitchen</text>
        <text x="1020" y="1104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">(Google Routes API v2 & Collect Package)</text>
        
    
    <line x1="1020" y1="1114" x2="1020" y2="1138" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="905.0" y="1138.0" width="230" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="1020" y="1157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Live GPS Streaming via WebSockets</text>
        <text x="1020" y="1172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">(Pusher + Animated Bike on Customer Map)</text>
        
    
    <line x1="1020" y1="1182" x2="1020" y2="1206" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    
    <rect x="905.0" y="1206.0" width="230" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="1020" y="1225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Doorstep Arrival & 4-Digit OTP</text>
        <text x="1020" y="1240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Handshake Verification via Rider Portal</text>
        
    
    <line x1="1020" y1="1250" x2="1020" y2="1275" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- STAGE 5: SETTLEMENT & REVIEW -->
    
    <rect x="905.0" y="1276.0" width="230" height="44" rx="6" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="1020" y="1295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Delivery Complete, 10% Platform Cut,</text>
        <text x="1020" y="1310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#000000">Net Vendor Payout & Customer Review</text>
        
    
    <line x1="1020" y1="1320" x2="1020" y2="1345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <circle cx="1020" cy="1357" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <circle cx="1020" cy="1357" r="8" fill="#000000" />
    
    
    </svg>
</body>
</html>
