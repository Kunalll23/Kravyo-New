<!DOCTYPE html>
<html>
<head>

<style>
  body {
    margin: 0;
    padding: 10px;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  svg {
    background: #ffffff;
  }
</style>
</head>
<body>
<svg width="1020" height="1100" viewBox="0 0 1020 1100" xmlns="http://www.w3.org/2000/svg">
    
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
  </marker>
</defs>


    <circle cx="480" cy="40" r="11" fill="#000000" stroke="#000000" stroke-width="1.3" />
    <line x1="480" y1="51" x2="480" y2="80" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="380.0" y="80.0" width="200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Open Kravyo App</text>
        
    
    <line x1="480" y1="124" x2="480" y2="171" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <polygon points="480,171.0 494.0,185 480,199.0 466.0,185" fill="#ffffff" stroke="#000000" stroke-width="1.3" />

    <path d="M 466 185 L 240 185 L 240 235" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="270" y="175" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[New User]</text>
    
    <rect x="140.0" y="236.0" width="200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="240" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Enter Signup Details</text>
        
    
    <line x1="240" y1="280" x2="240" y2="315" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="140.0" y="316.0" width="200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="240" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Validate Form & Send OTP</text>
        
    
    <line x1="240" y1="360" x2="240" y2="395" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="145.0" y="396.0" width="190" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="240" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Submit Email OTP</text>
        
    
    <line x1="240" y1="440" x2="240" y2="476" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <polygon points="240,476.0 254.0,490 240,504.0 226.0,490" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
    <!-- OTP Retry Loop -->
    <path d="M 254 490 L 380 490 L 380 418 L 335 418" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="265" y="480" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[OTP Invalid]</text>
    
    <line x1="240" y1="504" x2="240" y2="550" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="230.0" y="527.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[OTP Verified]</text>

        <text x="240" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Create Customer Account</text>
        
    
    <line x1="240" y1="594" x2="240" y2="630" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="135.0" y="630.0" width="210" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="240" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Save Address & Preferences</text>
        
    
    
    <!-- Right Branch: Existing User -->
    <path d="M 494 185 L 720 185 L 720 235" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="520" y="175" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Existing User]</text>

        <text x="720" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Enter Email & Password</text>

    <polygon points="720,326.0 734.0,340 720,354.0 706.0,340" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
    <!-- Forgot Password Branch -->
    <path d="M 734 340 L 910 340 L 910 400" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="750" y="330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Forgot Password]</text>
    
    <rect x="830.0" y="400.0" width="160" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="910" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Verify OTP & Reset Password</text>
        
    
    <path d="M 910 444 L 910 475 L 1000 475 L 1000 258 L 815 258" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="995" y="248" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Reset Done]</text>
    
    <!-- Standard Login Branch -->
    <line x1="720" y1="354" x2="720" y2="400" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="710.0" y="377.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Standard Login]</text>
    
    <rect x="625.0" y="400.0" width="190" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="720" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Verify Credentials</text>
        
    
    <line x1="720" y1="444" x2="720" y2="496" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <polygon points="720,496.0 734.0,510 720,524.0 706.0,510" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
    <!-- Invalid Credentials retry loop -->
    <path d="M 706 510 L 530 510 L 530 258 L 625 258" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="690" y="500" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Invalid]</text>
    
    <!-- JOIN BAR -->
    <line x1="240" y1="674" x2="240" y2="740" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <line x1="720" y1="524" x2="720" y2="740" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="730.0" y="632.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Valid]</text>
    <line x1="80" y1="740" x2="750" y2="740" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="88" y="756" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[User Verified]</text>
    
    <line x1="480" y1="740" x2="480" y2="795" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="380.0" y="796.0" width="200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="822" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Start User Session</text>
        
    
    <line x1="480" y1="840" x2="480" y2="875" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="375.0" y="876.0" width="210" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="480" y="902" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Show Customer Feed</text>
        
    
    <line x1="480" y1="920" x2="480" y2="955" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <circle cx="480" cy="970" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <circle cx="480" cy="970" r="8" fill="#000000" stroke="#000000" stroke-width="1" />
