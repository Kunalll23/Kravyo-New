    <polygon points="480,766.0 494.0,780 480,794.0 466.0,780" fill="#ffffff" stroke="#000000" stroke-width="1.3" />

    <line x1="480" y1="959" x2="480" y2="995" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
