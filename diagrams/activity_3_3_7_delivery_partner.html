<!DOCTYPE html>
<html>
<head>

<style>
  body {

    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  svg {
    background: #ffffff;
  }
</style>
</head>
<body>
<svg width="940" height="1160" viewBox="0 0 940 1160" xmlns="http://www.w3.org/2000/svg">
    
<defs>

    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
  </marker>
</defs>


    <circle cx="440" cy="40" r="11" fill="#000000" stroke="#000000" stroke-width="1.3" />

        <text x="440" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Broadcast Live GPS Ping</text>
        
    
    <line x1="440" y1="200" x2="440" y2="235" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

    <line x1="110" y1="880" x2="660" y2="880" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="118" y="872" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[Settlement & Alerts]</text>
    
    <line x1="260" y1="880" x2="260" y2="920" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="160.0" y="920.0" width="200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="260" y="946" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Credit Rider Payout</text>
        
    
    <line x1="260" y1="964" x2="260" y2="1005" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <line x1="620" y1="880" x2="620" y2="920" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="520.0" y="920.0" width="200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />

    <line x1="620" y1="964" x2="620" y2="1005" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- JOIN BAR -->
    <line x1="110" y1="1005" x2="660" y2="1005" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="118" y="1021" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[Order Handover Complete]</text>
    
    <line x1="440" y1="1005" x2="440" y2="1045" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="330.0" y="1046.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="440" y="1072" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Complete Order & Set Idle</text>
        
    
    <line x1="440" y1="1090" x2="440" y2="1125" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <circle cx="440" cy="1140" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <circle cx="440" cy="1140" r="8" fill="#000000" stroke="#000000" stroke-width="1" />
    
    
    </svg>
