<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 10px;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  svg {
    background: #ffffff;
  }
</style>
</head>
<body>
<svg width="900" height="1120" viewBox="0 0 900 1120" xmlns="http://www.w3.org/2000/svg">
    
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
  </marker>
</defs>


    <circle cx="450" cy="40" r="11" fill="#000000" stroke="#000000" stroke-width="1.3" />
    <line x1="450" y1="51" x2="450" y2="80" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="340.0" y="80.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Browse Tiffin Plans</text>
        
    
    <line x1="450" y1="124" x2="450" y2="155" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="340.0" y="156.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Choose Dietary Preference</text>
        
    
    <line x1="450" y1="200" x2="450" y2="235" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="340.0" y="236.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Set Schedule & Timings</text>
        
    
    <line x1="450" y1="280" x2="450" y2="315" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="340.0" y="316.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Select Delivery Address</text>
        
    
    <line x1="450" y1="360" x2="450" y2="395" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="340.0" y="396.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Calculate Plan Total</text>
        
    
    <line x1="450" y1="440" x2="450" y2="475" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="340.0" y="476.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="502" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Proceed to Payment</text>
        
    
    <line x1="450" y1="520" x2="450" y2="566" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <polygon points="450,566.0 464.0,580 450,594.0 436.0,580" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
    <!-- Payment Failure Branch -->
    <path d="M 464 580 L 660 580 L 660 498 L 560 498" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="475" y="570" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Payment Failed]</text>
    
    <!-- Payment Success Branch -->
    <line x1="450" y1="594" x2="450" y2="640" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" /><text x="440.0" y="617.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#000000">[Paid]</text>
    
    <rect x="340.0" y="640.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="666" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Activate Subscription</text>
        
    
    <line x1="450" y1="684" x2="450" y2="725" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- FORK BAR -->
    <line x1="120" y1="725" x2="690" y2="725" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="128" y="717" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[Setup Delivery Operations]</text>
    
    <!-- Thread A: Kitchen Roster -->
    <line x1="260" y1="725" x2="260" y2="765" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="150.0" y="766.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="260" y="792" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Add to Kitchen Daily Roster</text>
        
    
    <line x1="260" y1="810" x2="260" y2="850" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- Thread B: Delivery Schedules -->
    <line x1="640" y1="725" x2="640" y2="765" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="530.0" y="766.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="640" y="792" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Schedule Daily Deliveries</text>
        
    
    <line x1="640" y1="810" x2="640" y2="850" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- JOIN BAR -->
    <line x1="120" y1="850" x2="690" y2="850" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <text x="128" y="866" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#444444">[Plan Synchronized]</text>
    
    <line x1="450" y1="850" x2="450" y2="895" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <rect x="340.0" y="896.0" width="220" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    
        <text x="450" y="922" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">Show Confirmation Summary</text>
        
    
    <line x1="450" y1="940" x2="450" y2="975" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <circle cx="450" cy="990" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
    <circle cx="450" cy="990" r="8" fill="#000000" stroke="#000000" stroke-width="1" />
    
    
    </svg>
</body>
</html>
